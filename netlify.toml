[build]
  command = "npm install"
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "zisi"
  included_files = ["server/**", "node_modules/**"]

# Route all API calls to the serverless function; everything else is static.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
