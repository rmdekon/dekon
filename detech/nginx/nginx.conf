# DETECH — Nginx reverse proxy
# Terminates client connections, compresses responses and forwards to Next.js.

upstream detech_app {
    server app:3000;
    keepalive 32;
}

# Basic rate limiting on the auth endpoints to blunt credential stuffing.
limit_req_zone $binary_remote_addr zone=detech_login:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    # Security headers (the app sets its own too — these cover static assets)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # Immutable build assets
    location /_next/static/ {
        proxy_pass http://detech_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/auth/login {
        limit_req zone=detech_login burst=5 nodelay;
        proxy_pass http://detech_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://detech_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }

    location = /healthz {
        proxy_pass http://detech_app/api/health;
        access_log off;
    }
}
