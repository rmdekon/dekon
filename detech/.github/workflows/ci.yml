name: DETECH CI

on:
  push:
    branches: ["**"]
    paths: ["detech/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["detech/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: detech

env:
  DATABASE_URL: "file:./ci.db"
  AUTH_SECRET: "ci-only-secret-value-that-is-long-enough-to-pass"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck, unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: detech/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Prepare database
        run: |
          npx drizzle-kit push --force
          npm run db:seed

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: detech/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Seed database
        run: |
          npx drizzle-kit push --force
          npm run db:seed

      - name: Run Playwright tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: detech/playwright-report/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./detech
          push: false
          tags: detech:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
