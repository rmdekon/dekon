# ─────────────────────────────────────────────────────────────
#  DETECH — full stack: app + PostgreSQL + Redis + Nginx
#
#    docker compose up -d --build
#    open http://localhost
#
#  The app alone (SQLite, no extra services) is just:
#    docker build -t detech . && docker run -p 3000:3000 detech
# ─────────────────────────────────────────────────────────────

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Swap to the Postgres URL once you switch the Drizzle dialect:
      # DATABASE_URL: postgresql://detech:detech@postgres:5432/detech
      DATABASE_URL: file:/app/data/detech.db
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in your .env file}
      SESSION_MAX_AGE: 604800
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
    volumes:
      - detech-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "3000"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: detech
      POSTGRES_PASSWORD: detech
      POSTGRES_DB: detech
    volumes:
      - detech-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detech -d detech"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - detech-redis:/data
    ports:
      - "6379:6379"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  detech-data:
  detech-pg:
  detech-redis:
