# Fly.io configuration for DEKON
# After `fly launch` with this file, run:
#   fly volumes create dekon_data --size 1
#   fly secrets set JWT_SECRET="..." APP_URL="https://YOUR-APP.fly.dev"
#   fly deploy

app = "dekon-finance"
primary_region = "mad"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"

[mounts]
  source = "dekon_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"
